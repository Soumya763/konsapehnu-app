<style>

<div class="mb-xl">

<div class="flex flex-wrap gap-sm flex-1" role="radiogroup" aria-label="Discovery source">
<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>
                    Friends or Family
                </label>
<label class="chip-card selected cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input checked="" class="sr-only" name="discovery" type="radio"/>
                    App Store / Google Play
                </label>
<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>
                    Instagram
                </label>
<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>

                </label>
<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>

<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>

<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>

                </label>
<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>
                    Online Search
                </label>
<label class="chip-card cursor-pointer border border-hairline rounded-full px-4 py-2 bg-surface-container-lowest font-title-md text-[14px] text-ink">
<input class="sr-only" name="discovery" type="radio"/>

                </label>
</div>

<a class="shimmer-btn flex-1 bg-primary-container text-on-primary-container font-title-md text-title-md py-3.5 rounded-full text-center hover:bg-primary transition-colors" href="../birthday_profile/code.html" id="continue-btn">
                Continue
            </a>

</main>

<script>
    document.querySelectorAll('.chip-card input').forEach((input) => {
        input.addEventListener('change', (event) => {
            document.querySelectorAll('.chip-card').forEach((c) => c.classList.remove('selected'));
            event.target.closest('.chip-card').classList.add('selected');
        });
    });

    document.getElementById('continue-btn').addEventListener('click', function () {
        var checked = document.querySelector('input[name="discovery"]:checked');
        var value = checked ? checked.closest('.chip-card').textContent.trim() : null;
        var STORAGE_KEY = 'konsapehnu_onboarding';
        var data = {};
        try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { data = {}; }
        data.discoverySource = value;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ }
    });
</script>
