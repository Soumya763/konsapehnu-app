<script>
    (function () {
        const params = new URLSearchParams(window.location.search);
        const title = params.get('title');
        const desc = params.get('desc');
        const icon = params.get('icon');
        const back = params.get('back');
        if (title) {
            document.getElementById('page-title').textContent = title;
            document.getElementById('page-heading').textContent = title;
        }
        if (desc) {
            document.getElementById('page-desc').textContent = desc;
        }
        if (icon) {
            document.getElementById('page-icon').textContent = icon;
        }
        if (back) {
            document.getElementById('back-link').setAttribute('href', back);
        }
    })();
