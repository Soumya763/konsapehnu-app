<style>
        .jali-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 3.33333L36.6667 20L20 36.6667L3.33333 20L20 3.33333ZM20 6.66667L6.66667 20L20 33.3333L33.3333 20L20 6.66667Z' fill='%23c9c4b9' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .shimmer-btn { position: relative; overflow: hidden; }
        .shimmer-btn:hover::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.12), transparent);
            transform: skewX(-20deg);
            animation: shimmer 1s forwards;
        }
        @keyframes shimmer { 100% { left: 200%; } }
        .style-card { transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease; }
        .style-card:hover { transform: translateY(-2px); }
        .style-card.selected { border-color: #b8752e; background: #f3eee4; }
        .style-card.selected .check { opacity: 1; transform: scale(1); }
        .check { opacity: 0; transform: scale(0.6); transition: opacity 0.2s ease, transform 0.2s ease; }
    </style>
</head>
<body class="bg-background text-on-background font-body-base jali-pattern min-h-screen flex flex-col relative pb-safe">

<!-- Header: Back + Progress -->
<header class="sticky top-0 z-20 bg-surface/90 backdrop-blur-md border-b border-hairline">
<div class="flex items-center justify-between px-margin-mobile h-16 max-w-md mx-auto">
<a aria-label="Back" class="text-on-surface-variant hover:text-secondary transition-colors" href="../confidence_intro/code.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Step 10 of 11</span>
<div class="w-6"></div>
</div>
<div class="h-1 bg-hairline max-w-md mx-auto">
<div class="h-1 bg-primary-container" style="width: 90.9%;"></div>
</div>
</header>

<main class="flex-1 px-margin-mobile pt-xl pb-2xl max-w-md mx-auto w-full flex flex-col">

<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink mb-sm">Which body type is closest to yours?</h1>
<p class="font-body-base text-body-base text-on-surface-variant">This helps us recommend silhouettes and fits that genuinely work for you.</p>
</div>

<div class="grid grid-cols-2 gap-md flex-1" role="radiogroup" aria-label="Body type">

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-lowest text-center">
<input class="sr-only" name="body-type" type="radio"/>
<svg class="text-primary-container" fill="none" height="66" viewBox="0 0 60 90" width="44">
<circle cx="30" cy="12" fill="none" r="9" stroke="currentColor" stroke-width="2.5"></circle>
<polygon fill="none" points="16,24 44,24 44,82 16,82" stroke="currentColor" stroke-linejoin="round" stroke-width="2.5"></polygon>
</svg>
<span class="font-title-md text-[14px] text-ink">Rectangle</span>
<span class="font-body-sm text-[11px] text-on-surface-variant">Similar shoulders &amp; hips</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 16px;">check_circle</span>
</label>

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-lowest text-center">
<input class="sr-only" name="body-type" type="radio"/>
<svg class="text-primary-container" fill="none" height="66" viewBox="0 0 60 90" width="44">
<circle cx="30" cy="12" fill="none" r="9" stroke="currentColor" stroke-width="2.5"></circle>
<polygon fill="none" points="20,24 40,24 50,82 10,82" stroke="currentColor" stroke-linejoin="round" stroke-width="2.5"></polygon>
</svg>
<span class="font-title-md text-[14px] text-ink">Triangle</span>
<span class="font-body-sm text-[11px] text-on-surface-variant">Narrower up top, fuller below</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 16px;">check_circle</span>
</label>

<label class="style-card selected cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-lowest text-center">
<input checked="" class="sr-only" name="body-type" type="radio"/>
<svg class="text-primary-container" fill="none" height="66" viewBox="0 0 60 90" width="44">
<circle cx="30" cy="12" fill="none" r="9" stroke="currentColor" stroke-width="2.5"></circle>
<polygon fill="none" points="10,24 50,24 40,82 20,82" stroke="currentColor" stroke-linejoin="round" stroke-width="2.5"></polygon>
</svg>
<span class="font-title-md text-[14px] text-ink">Inverted Triangle</span>
<span class="font-body-sm text-[11px] text-on-surface-variant">Broader shoulders, leaner hips</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 16px;">check_circle</span>
</label>

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-lowest text-center">
<input class="sr-only" name="body-type" type="radio"/>
<svg class="text-primary-container" fill="none" height="66" viewBox="0 0 60 90" width="44">
<circle cx="30" cy="12" fill="none" r="9" stroke="currentColor" stroke-width="2.5"></circle>
<path d="M20,24 Q10,50 20,82 L40,82 Q50,50 40,24 Z" fill="none" stroke="currentColor" stroke-linejoin="round" stroke-width="2.5"></path>
</svg>
<span class="font-title-md text-[14px] text-ink">Oval</span>
<span class="font-body-sm text-[11px] text-on-surface-variant">Fuller through the middle</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 16px;">check_circle</span>
</label>

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col items-center gap-xs bg-surface-container-lowest text-center col-span-2">
<input class="sr-only" name="body-type" type="radio"/>
<svg class="text-primary-container" fill="none" height="66" viewBox="0 0 60 90" width="44">
<circle cx="30" cy="12" fill="none" r="9" stroke="currentColor" stroke-width="2.5"></circle>
<polygon fill="none" points="12,24 48,24 48,82 12,82" stroke="currentColor" stroke-linejoin="round" stroke-width="2.5"></polygon>
</svg>
<span class="font-title-md text-[14px] text-ink">Square</span>
<span class="font-body-sm text-[11px] text-on-surface-variant">Solid build, straight lines throughout</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 16px;">check_circle</span>
</label>

</div>

<div class="flex gap-md mt-xl">
<a class="flex-1 border border-ink text-ink font-title-md text-title-md py-3.5 rounded-full text-center hover:border-secondary hover:text-secondary transition-colors" href="../confidence_intro/code.html">
                Back
            </a>
<a class="shimmer-btn flex-1 bg-primary-container text-on-primary-container font-title-md text-title-md py-3.5 rounded-full text-center hover:bg-primary transition-colors" href="../height_weight_profile/code.html" id="continue-btn">
                Continue
            </a>
</div>

</main>

<script>
    document.querySelectorAll('.style-card input').forEach((input) => {
        input.addEventListener('change', (event) => {
            document.querySelectorAll('.style-card').forEach((c) => c.classList.remove('selected'));
            event.target.closest('.style-card').classList.add('selected');
        });
    });

    document.getElementById('continue-btn').addEventListener('click', function () {
        var checked = document.querySelector('input[name="body-type"]:checked');
        var value = checked ? checked.closest('.style-card').querySelector('.font-title-md').textContent : null;
        var STORAGE_KEY = 'konsapehnu_onboarding';
        var data = {};
        try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { data = {}; }
        data.bodyType = value;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ }
    });
</script>

</body></html>
