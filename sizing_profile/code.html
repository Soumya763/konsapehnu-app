<!-- Header: Back + Progress -->
<header class="sticky top-0 z-20 bg-surface/90 backdrop-blur-md border-b border-hairline">

<main class="flex-1 px-margin-mobile pt-xl pb-2xl max-w-md mx-auto w-full flex flex-col gap-xl">

<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink mb-sm">Get the sizing right</h1>
<p class="font-body-base text-body-base text-on-surface-variant">So every recommendation — Western or ethnic — actually fits.</p>
</div>

<!-- Western Sizing -->
<div>
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-md">Western wear</h2>
<div class="grid grid-cols-3 gap-sm">
<div>
<label class="font-label-caps text-[10px] text-on-surface-variant uppercase block mb-xs" for="shirt-size">Shirt</label>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all">
<select class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="shirt-size" name="shirt-size">
<option>S</option>
<option>M</option>
<option selected="">L</option>
<option>XL</option>
<option>XXL</option>
</select>
</div>
</div>
<div>
<label class="font-label-caps text-[10px] text-on-surface-variant uppercase block mb-xs" for="jacket-size">Jacket</label>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all">
<select class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="jacket-size" name="jacket-size">
<option>36"</option>
<option>38"</option>
<option selected="">40"</option>
<option>42"</option>
<option>44"</option>
</select>
</div>
</div>
<div>
<label class="font-label-caps text-[10px] text-on-surface-variant uppercase block mb-xs" for="waist-size">Waist</label>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all">
<select class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="waist-size" name="waist-size">
<option>30"</option>
<option>32"</option>
<option selected="">34"</option>
<option>36"</option>
<option>38"</option>
</select>
</div>
</div>
</div>
</div>

<!-- Ethnic & Footwear Sizing -->
<div>
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase mb-md">Ethnic wear &amp; footwear</h2>
<div class="grid grid-cols-3 gap-sm">
<div>
<label class="font-label-caps text-[10px] text-on-surface-variant uppercase block mb-xs" for="kurta-size">Kurta</label>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all">
<select class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="kurta-size" name="kurta-size">
<option>S</option>
<option>M</option>
<option selected="">L</option>
<option>XL</option>
<option>XXL</option>
</select>
</div>
</div>
<div>
<label class="font-label-caps text-[10px] text-on-surface-variant uppercase block mb-xs" for="inseam-length">Inseam</label>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all">

</div>

<option>8</option>
<option selected="">9</option>
<option>10</option>
<option>11</option>
</select>
</div>
</div>
</div>
