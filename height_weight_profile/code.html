<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Konsa Pehnu - Height &amp; Weight</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#fcf9f2",
                      "on-secondary": "#ffffff",
                      "sandstone": "#c9c4b9",
                      "primary": "#5c051d",
                      "surface-variant": "#e5e2db",
                      "on-surface": "#1c1c18",
                      "surface-bright": "#fcf9f2",
                      "secondary-container": "#feb064",
                      "emerald-match": "#0b6e4f",
                      "surface-container-lowest": "#ffffff",
                      "on-background": "#1c1c18",
                      "cream-container": "#f3eee4",
                      "on-primary": "#ffffff",
                      "secondary": "#b8752e",
                      "indigo-slate": "#243746",
                      "primary-container": "#7a1f32",
                      "outline": "#887173",
                      "on-surface-variant": "#554243",
                      "on-primary-container": "#ff8b9b",
                      "surface-container": "#f0eee7",
                      "surface": "#fcf9f2",
                      "outline-variant": "#dbc0c2",
                      "ink": "#3E2723",
                      "hairline": "#d8d0c2"
              },
              "spacing": {
                      "xl": "32px",
                      "margin-mobile": "5vw",
                      "unit": "4px",
                      "margin-desktop": "5vw",
                      "3xl": "64px",
                      "xs": "4px",
                      "md": "16px",
                      "gutter": "20px",
                      "2xl": "48px",
                      "sm": "8px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "body-lead": ["Inter"],
                      "body-sm": ["Inter"],
                      "body-base": ["Inter"],
                      "headline-lg-mobile": ["Playfair Display"],
                      "headline-md": ["Playfair Display"],
                      "label-caps": ["Inter"],
                      "title-md": ["Inter"]
              },
              "fontSize": {
                      "body-lead": ["18px", {"lineHeight": "1.7", "letterSpacing": "0", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                      "body-base": ["15px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "letterSpacing": "-0.4px", "fontWeight": "600"}],
                      "headline-md": ["25px", {"lineHeight": "1.12", "letterSpacing": "-0.3px", "fontWeight": "600"}],
                      "label-caps": ["11px", {"lineHeight": "1.4", "letterSpacing": "2px", "fontWeight": "600"}],
                      "title-md": ["18px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .jali-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 3.33333L36.6667 20L20 36.6667L3.33333 20L20 3.33333ZM20 6.66667L6.66667 20L20 33.3333L33.3333 20L20 6.66667Z' fill='%23c9c4b9' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .shimmer-btn { position: relative; overflow: hidden; }
        .shimmer-btn:hover::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.12), transparent);
            transform: skewX(-20deg);
            animation: shimmer 1s forwards;
        }
        @keyframes shimmer { 100% { left: 200%; } }
        .field-focus:focus-within {
            border-color: #b8752e;
            box-shadow: 0 0 0 3px rgba(139, 80, 7, 0.12);
        }
        .unit-toggle { background: #f0eee7; border-radius: 9999px; padding: 4px; display: inline-flex; gap: 2px; }
        .unit-toggle button { padding: 6px 16px; border-radius: 9999px; font-family: Inter; font-size: 12px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; color: #554243; transition: background-color 0.2s ease, color 0.2s ease; }
        .unit-toggle button.active { background: #7a1f32; color: #ffffff; }
    </style>
</head>
<body class="bg-background text-on-background font-body-base jali-pattern min-h-screen flex flex-col relative pb-safe">

<!-- Header: Back + Progress -->
<header class="sticky top-0 z-20 bg-surface/90 backdrop-blur-md border-b border-hairline">
<div class="flex items-center justify-between px-margin-mobile h-16 max-w-md mx-auto">
<a aria-label="Back" class="text-on-surface-variant hover:text-secondary transition-colors" href="../body_type_profile/code.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Step 11 of 11</span>
<div class="w-6"></div>
</div>
<div class="h-1 bg-hairline max-w-md mx-auto">
<div class="h-1 bg-primary-container" style="width: 100%;"></div>
</div>
</header>

<main class="flex-1 px-margin-mobile pt-xl pb-2xl max-w-md mx-auto w-full flex flex-col gap-xl">

<div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink mb-sm">Almost done — your measurements</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Height and weight round out your profile for genuinely personalized fits.</p>
</div>

<!-- Height -->
<div>
<div class="flex items-center justify-between mb-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Height</h2>
<div class="unit-toggle">
<button class="active" data-unit-group="height" data-unit-value="cm" type="button">cm</button>
<button data-unit-group="height" data-unit-value="ftin" type="button">ft / in</button>
</div>
</div>

<div data-height-panel="cm">
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all flex items-center px-3">
<input class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="height-cm" inputmode="numeric" max="230" min="120" placeholder="e.g. 178" type="number"/>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">cm</span>
</div>
</div>

<div class="hidden gap-sm" data-height-panel="ftin">
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all flex items-center px-3 flex-1">
<input class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="height-ft" inputmode="numeric" max="7" min="3" placeholder="6" type="number"/>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">ft</span>
</div>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all flex items-center px-3 flex-1">
<input class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="height-in" inputmode="numeric" max="11" min="0" placeholder="2" type="number"/>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">in</span>
</div>
</div>
</div>

<!-- Weight -->
<div>
<div class="flex items-center justify-between mb-md">
<h2 class="font-label-caps text-label-caps text-on-surface-variant uppercase">Weight</h2>
<div class="unit-toggle">
<button class="active" data-unit-group="weight" data-unit-value="kg" type="button">kg</button>
<button data-unit-group="weight" data-unit-value="lb" type="button">lb</button>
</div>
</div>
<div class="field-focus border border-hairline rounded-lg bg-surface transition-all flex items-center px-3">
<input class="w-full bg-transparent border-none focus:ring-0 px-3 py-3 font-body-base text-body-base text-ink" id="weight-value" inputmode="numeric" max="200" min="30" placeholder="e.g. 72" type="number"/>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase" id="weight-unit-label">kg</span>
</div>
</div>

<div class="flex gap-md mt-md">
<a class="flex-1 border border-ink text-ink font-title-md text-title-md py-3.5 rounded-full text-center hover:border-secondary hover:text-secondary transition-colors" href="../body_type_profile/code.html">
                Back
            </a>
<a class="shimmer-btn flex-1 bg-primary-container text-on-primary-container font-title-md text-title-md py-3.5 rounded-full text-center hover:bg-primary transition-colors" href="../today_s_look/code.html" id="finish-btn">
                Finish
            </a>
</div>

</main>

<script>
    document.querySelectorAll('.unit-toggle button').forEach(function (btn) {
        btn.addEventListener('click', function () {
            var group = btn.dataset.unitGroup;
            var value = btn.dataset.unitValue;

            document.querySelectorAll('.unit-toggle button[data-unit-group="' + group + '"]').forEach(function (b) {
                b.classList.toggle('active', b === btn);
            });

            if (group === 'height') {
                document.querySelector('[data-height-panel="cm"]').classList.toggle('hidden', value !== 'cm');
                var ftinPanel = document.querySelector('[data-height-panel="ftin"]');
                ftinPanel.classList.toggle('hidden', value !== 'ftin');
                ftinPanel.classList.toggle('flex', value === 'ftin');
            }

            if (group === 'weight') {
                document.getElementById('weight-unit-label').textContent = value;
            }
        });
    });

    document.getElementById('finish-btn').addEventListener('click', function () {
        var heightUnit = document.querySelector('.unit-toggle button[data-unit-group="height"].active').dataset.unitValue;
        var weightUnit = document.querySelector('.unit-toggle button[data-unit-group="weight"].active').dataset.unitValue;

        var height = heightUnit === 'cm'
            ? { unit: 'cm', value: document.getElementById('height-cm').value || null }
            : { unit: 'ftin', feet: document.getElementById('height-ft').value || null, inches: document.getElementById('height-in').value || null };

        var weight = { unit: weightUnit, value: document.getElementById('weight-value').value || null };

        var STORAGE_KEY = 'konsapehnu_onboarding';
        var data = {};
        try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { data = {}; }
        data.height = height;
        data.weight = weight;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ }
    });
</script>

</body></html>
