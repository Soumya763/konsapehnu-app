<script>
    document.querySelectorAll('.style-card input, .swatch-card input').forEach((input) => {
        input.addEventListener('change', (event) => {
            const card = event.target.closest('.style-card, .swatch-card');
            if (event.target.type === 'radio') {
                const group = event.target.closest('[role="radiogroup"]');
                group.querySelectorAll('.style-card').forEach((c) => c.classList.toggle('selected', c === card));
            } else {
                card.classList.toggle('selected', event.target.checked);
            }
        });
    });
    document.querySelectorAll('.chip-card input').forEach((input) => {
        input.addEventListener('change', (event) => {
            event.target.closest('.chip-card').classList.toggle('selected', event.target.checked);
        });
    });
</script>
