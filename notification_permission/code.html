            </a>
</div>

</main>

<script>
    function saveOnboardingAnswer(key, value) {
        var STORAGE_KEY = 'konsapehnu_onboarding';
        var data = {};
        try { data = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch (e) { data = {}; }
        data[key] = value;
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) { /* storage unavailable */ }
    }

    document.getElementById('maybe-later').addEventListener('click', function () {
        saveOnboardingAnswer('notifications', 'declined');
    });

    document.getElementById('enable-notifications').addEventListener('click', function () {
        var proceed = function (permission) {
            saveOnboardingAnswer('notifications', permission || 'unsupported');
            window.location.href = '../onboarding_goals/code.html';
        };
        if (typeof Notification !== 'undefined' && Notification.requestPermission) {
            Notification.requestPermission().then(proceed).catch(function () { proceed('error'); });
        } else {
            proceed('unsupported');
        }
    });
</script>
