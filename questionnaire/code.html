<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Konsa Pehnu - Style Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "background": "#fcf9f2",
                      "on-secondary": "#ffffff",
                      "sandstone": "#c9c4b9",
                      "primary": "#5c051d",
                      "surface-variant": "#e5e2db",
                      "on-surface": "#1c1c18",
                      "surface-bright": "#fcf9f2",
                      "secondary-container": "#feb064",
                      "emerald-match": "#0b6e4f",
                      "surface-container-lowest": "#ffffff",
                      "on-background": "#1c1c18",
                      "cream-container": "#f3eee4",
                      "on-primary": "#ffffff",
                      "secondary": "#b8752e",
                      "indigo-slate": "#243746",
                      "primary-container": "#7a1f32",
                      "outline": "#887173",
                      "on-surface-variant": "#554243",
                      "on-primary-container": "#ff8b9b",
                      "surface-container": "#f0eee7",
                      "surface": "#fcf9f2",
                      "outline-variant": "#dbc0c2",
                      "ink": "#3E2723",
                      "hairline": "#d8d0c2"
              },
              "spacing": {
                      "xl": "32px",
                      "margin-mobile": "5vw",
                      "unit": "4px",
                      "margin-desktop": "5vw",
                      "3xl": "64px",
                      "xs": "4px",
                      "md": "16px",
                      "gutter": "20px",
                      "2xl": "48px",
                      "sm": "8px",
                      "lg": "24px"
              },
              "fontFamily": {
                      "body-lead": ["Inter"],
                      "body-sm": ["Inter"],
                      "body-base": ["Inter"],
                      "headline-lg-mobile": ["Playfair Display"],
                      "headline-md": ["Playfair Display"],
                      "label-caps": ["Inter"],
                      "title-md": ["Inter"]
              },
              "fontSize": {
                      "body-lead": ["18px", {"lineHeight": "1.7", "letterSpacing": "0", "fontWeight": "400"}],
                      "body-sm": ["14px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                      "body-base": ["15px", {"lineHeight": "1.6", "letterSpacing": "0", "fontWeight": "400"}],
                      "headline-lg-mobile": ["28px", {"lineHeight": "1.2", "letterSpacing": "-0.4px", "fontWeight": "600"}],
                      "headline-md": ["25px", {"lineHeight": "1.12", "letterSpacing": "-0.3px", "fontWeight": "600"}],
                      "label-caps": ["11px", {"lineHeight": "1.4", "letterSpacing": "2px", "fontWeight": "600"}],
                      "title-md": ["18px", {"lineHeight": "1.4", "letterSpacing": "0", "fontWeight": "600"}]
              }
            }
          }
        }
    </script>
<style>
        .jali-pattern {
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 3.33333L36.6667 20L20 36.6667L3.33333 20L20 3.33333ZM20 6.66667L6.66667 20L20 33.3333L33.3333 20L20 6.66667Z' fill='%23c9c4b9' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .shimmer-btn { position: relative; overflow: hidden; }
        .shimmer-btn:hover::after {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.12), transparent);
            transform: skewX(-20deg);
            animation: shimmer 1s forwards;
        }
        @keyframes shimmer { 100% { left: 200%; } }
        .style-card { transition: border-color 0.2s ease, background-color 0.2s ease, transform 0.2s ease; }
        .style-card:hover { transform: translateY(-2px); }
        .style-card.selected { border-color: #b8752e; background: #f3eee4; }
        .style-card.selected .check { opacity: 1; transform: scale(1); }
        .check { opacity: 0; transform: scale(0.6); transition: opacity 0.2s ease, transform 0.2s ease; }
    </style>
</head>
<body class="bg-background text-on-background font-body-base jali-pattern min-h-screen flex flex-col relative pb-safe">

<!-- Header: Back + Progress -->
<header class="sticky top-0 z-20 bg-surface/90 backdrop-blur-md border-b border-hairline">
<div class="flex items-center justify-between px-margin-mobile h-16 max-w-md mx-auto">
<a aria-label="Back" class="text-on-surface-variant hover:text-secondary transition-colors" href="../onboarding/code.html">
<span class="material-symbols-outlined">arrow_back</span>
</a>
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Step 2 of 4</span>
<div class="w-6"></div>
</div>
<div class="h-1 bg-hairline max-w-md mx-auto">
<div class="h-1 bg-primary-container" style="width: 50%;"></div>
</div>
</header>

<main class="flex-1 px-margin-mobile pt-xl pb-2xl max-w-md mx-auto w-full flex flex-col">

<div class="mb-xl">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-ink mb-sm">What's your go-to style?</h1>
<p class="font-body-base text-body-base text-on-surface-variant">Choose as many as feel like you — we'll fine-tune from there.</p>
</div>

<div class="grid grid-cols-2 gap-md flex-1" role="group" aria-label="Style preference options">

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col gap-sm bg-surface-container-lowest">
<input class="sr-only" name="style" type="checkbox"/>
<span class="material-symbols-outlined text-primary-container" style="font-size: 26px;">checkroom</span>
<span class="font-title-md text-[15px] text-ink">Classic Tailoring</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 18px;">check_circle</span>
</label>

<label class="style-card selected cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col gap-sm bg-surface-container-lowest">
<input checked="" class="sr-only" name="style" type="checkbox"/>
<span class="material-symbols-outlined text-primary-container" style="font-size: 26px;">stars_2</span>
<span class="font-title-md text-[15px] text-ink">Contemporary Minimal</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 18px;">check_circle</span>
</label>

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col gap-sm bg-surface-container-lowest">
<input class="sr-only" name="style" type="checkbox"/>
<span class="material-symbols-outlined text-primary-container" style="font-size: 26px;">diversity_1</span>
<span class="font-title-md text-[15px] text-ink">Indo-Western Fusion</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 18px;">check_circle</span>
</label>

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col gap-sm bg-surface-container-lowest">
<input class="sr-only" name="style" type="checkbox"/>
<span class="material-symbols-outlined text-primary-container" style="font-size: 26px;">celebration</span>
<span class="font-title-md text-[15px] text-ink">Festive &amp; Traditional</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 18px;">check_circle</span>
</label>

<label class="style-card cursor-pointer relative border border-hairline rounded-xl p-md flex flex-col gap-sm bg-surface-container-lowest col-span-2">
<input class="sr-only" name="style" type="checkbox"/>
<span class="material-symbols-outlined text-primary-container" style="font-size: 26px;">bolt</span>
<span class="font-title-md text-[15px] text-ink">Streetwear Edge</span>
<span class="check absolute top-3 right-3 material-symbols-outlined text-emerald-match" style="font-size: 18px;">check_circle</span>
</label>

</div>

<div class="flex gap-md mt-xl">
<a class="flex-1 border border-ink text-ink font-title-md text-title-md py-3.5 rounded-full text-center hover:border-secondary hover:text-secondary transition-colors" href="../onboarding/code.html">
                Back
            </a>
<a class="shimmer-btn flex-1 bg-primary-container text-on-primary-container font-title-md text-title-md py-3.5 rounded-full text-center hover:bg-primary transition-colors" href="../today_s_look/code.html">
                Continue
            </a>
</div>

</main>

<script>
    document.querySelectorAll('.style-card input').forEach((input) => {
        input.addEventListener('change', (event) => {
            event.target.closest('.style-card').classList.toggle('selected', event.target.checked);
        });
    });
</script>

</body></html>
